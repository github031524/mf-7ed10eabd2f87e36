<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Market Feed</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="color-scheme" content="dark" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#d9e1f0;--muted:#8a97b1;--green:#2ee59d}
            html.staticrypt-html{height:100%;background:var(--bg)}
            .staticrypt-body{height:100%;margin:0;background:var(--bg);color:var(--text)}
            .staticrypt-content{height:100%;margin:0;background:radial-gradient(900px 400px at 50% -120px,#16233f 0,var(--bg) 70%) no-repeat,var(--bg);
                font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
            .staticrypt-page{width:100%;max-width:380px;padding:14vh 16px 0;margin:auto;box-sizing:border-box}
            .staticrypt-form{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:8px;padding:30px 26px 26px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
            .staticrypt-instructions{margin:0 0 4px}
            .staticrypt-instructions p{margin:0 0 6px;color:var(--muted);font-size:13px}
            .staticrypt-title{font:700 17px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;letter-spacing:.14em;color:var(--green)!important;text-transform:uppercase}
            .staticrypt-hr{margin:16px 0;border:0;border-top:1px solid var(--line)}
            .staticrypt-password-container{position:relative;background:#0a1020;border:1px solid var(--line);border-radius:6px;margin:0 0 14px}
            .staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;color:var(--text);border:0;box-sizing:border-box;font-size:16px;outline:0;padding:14px 44px 14px 14px;width:100%;border-radius:6px}
            .staticrypt-password-container:focus-within{border-color:var(--green)}
            .staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:.6;padding:13px;position:absolute;right:0;top:50%;transform:translateY(-50%);filter:invert(1)}
            label.staticrypt-remember{display:flex;align-items:center;margin-bottom:16px;color:var(--muted);font-size:14px;text-align:left}
            .staticrypt-remember input[type="checkbox"]{width:18px;height:18px;margin:0 12px 0 0;accent-color:var(--green)}
            .staticrypt-form .staticrypt-decrypt-button{outline:0;background:var(--green);width:100%;border:0;border-radius:6px;padding:14px;color:#04130c;font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;cursor:pointer;min-height:46px;-webkit-appearance:none}
            .staticrypt-form .staticrypt-decrypt-button:active{filter:brightness(.92)}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid #2a3a5c;border-right-color:var(--green);border-radius:50%;animation:spinner-border .75s linear infinite}
            @keyframes spinner-border{100%{transform:rotate(360deg)}}
        </style>
    </head>

    <body class="staticrypt-body">

            <div class="staticrypt-spinner"></div>
        </div>
